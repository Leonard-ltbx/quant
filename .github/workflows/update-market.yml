name: Update real market data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 1-8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and normalize quotes
        run: python scripts/update_market.py --output /tmp/market.json

      - name: Publish data to GitHub Pages branch
        shell: bash
        run: |
          git checkout gh-pages
          mkdir -p data
          cp /tmp/market.json data/market.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No market data changes"
            exit 0
          fi
          git commit -m "Update real market data"
          git push origin gh-pages
